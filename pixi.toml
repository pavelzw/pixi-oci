[workspace]
name = "pixi-oci"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[tasks]
build = "cargo build --release"
test = "cargo test"
example = "cargo run -- build --manifest-path example"
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run -a"

[dependencies]
rust = "==1.98.1"
openssl = "3.*"
pkg-config = "*"
pre-commit = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
shellcheck = "*"

[target.linux.dependencies]
compilers = ">=1.7.0"
