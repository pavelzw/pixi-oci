# A workspace with pixi-build source packages, built by `pixi-oci build` with `pixi publish`.
[workspace]
channels = ["conda-forge"]
name = "source-build"
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[workspace.dependencies]
greeter = { path = "greeter" }

[dependencies]
app = { path = "app" }

[tool.pixi-oci]
tag = "source-build"
base = "scratch"
