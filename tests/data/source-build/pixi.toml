# A workspace with a pixi-build source package, built by `pixi-oci build` with `pixi publish`.
[workspace]
channels = ["conda-forge"]
name = "source-build"
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
greeter = { path = "greeter" }

[tool.pixi-oci]
tag = "source-build"
base = "scratch"
