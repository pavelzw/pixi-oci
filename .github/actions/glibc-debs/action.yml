name: Cached glibc packages
description: >-
  Restore the libc6 packages pinned in build.rs from the cache (downloading them from
  snapshot.debian.org on a miss) and point GLIBC_DEBIAN_FILE at them, so neither the
  `bundled-glibc` build nor the tests depend on snapshot.debian.org being up.
runs:
  using: composite
  steps:
    - name: Restore glibc packages
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/glibc-debs
        key: glibc-debs-${{ hashFiles('build.rs', 'src/default_glibc.rs') }}
    - name: Download glibc packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$DEBS"
        # The (architecture, SHA-1) pins of build.rs.
        grep -oE '\("[a-z0-9]+", "[0-9a-f]{40}"\)' build.rs | tr -d '(),"' |
          while read -r arch sha1; do
            curl --fail --silent --show-error --location --retry 10 --retry-all-errors \
              --output "$DEBS/libc6_$arch.deb" "https://snapshot.debian.org/file/$sha1"
            echo "$sha1  $DEBS/libc6_$arch.deb" | shasum -a 1 --check
          done
      env:
        DEBS: ${{ runner.temp }}/glibc-debs
    - name: Use cached glibc packages
      shell: bash
      run: echo "GLIBC_DEBIAN_FILE=$(printf '%s:' "$DEBS"/*.deb | sed 's/:$//')" >> "$GITHUB_ENV"
      env:
        DEBS: ${{ runner.temp }}/glibc-debs
